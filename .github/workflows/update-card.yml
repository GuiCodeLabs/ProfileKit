name: Gerar cartões do perfil

on:
  schedule:
    # Ações agendadas podem atrasar; o intervalo mínimo do GitHub é cinco minutos.
    - cron: "7,22,37,52 * * * *"
    - cron: "13 4 * * *" # Apenas esta execução consulta o contador (uma leitura por dia).
  workflow_dispatch:
    inputs:
      refresh_visits:
        description: "Atualizar também a cópia estática do contador de visitas"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - scripts/generate_card.py
      - scripts/preview.py
      - api/card.js
      - tests/**
      - package.json
      - profile-card.json
      - .github/workflows/update-card.yml
  pull_request:
    paths:
      - scripts/generate_card.py
      - scripts/preview.py
      - api/card.js
      - tests/**
      - package.json
      - profile-card.json
      - profile/**
      - .github/workflows/update-card.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verificar sintaxe Python
        run: python3 -m py_compile scripts/generate_card.py scripts/preview.py
      - run: python3 -m unittest discover -s tests -v
      - run: npm test
      - name: Renderizar prévia com o snapshot do perfil
        run: python3 scripts/preview.py --data profile/data.json --output-dir "$RUNNER_TEMP/profile-card-preview"

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: profile-card-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Gerar métricas e SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional fine-grained token with Metadata: read on selected private repositories.
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REFRESH_VISITS: ${{ inputs.refresh_visits }}
        run: |
          args=()
          if [[ "$EVENT_SCHEDULE" == "13 4 * * *" || ( "$EVENT_NAME" == "workflow_dispatch" && "$REFRESH_VISITS" == "true" ) ]]; then
            args+=(--refresh-visits)
          fi
          python3 scripts/generate_card.py "${args[@]}"
      - name: Publicar alterações de dados
        run: |
          git add -- profile/data.json profile/*.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m '📊 chore(stats): atualiza cartões do perfil'
            git push origin HEAD:main
          fi
